version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SEC_USER_AGENT=${SEC_USER_AGENT:-legalens/1.0 contact@example.com}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
