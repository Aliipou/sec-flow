name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx pytest-timeout respx

      - name: Test
        run: pytest --tb=short -q
        env:
          PYTHONPATH: .
          SEC_USER_AGENT: "secflow-ci/1.0 ci@example.com"

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sec-flow:ci .

      - name: Smoke test
        run: |
          docker run -d --name secflow_ci -p 8000:8000 \
            -e SEC_USER_AGENT="secflow-ci/1.0 ci@example.com" \
            sec-flow:ci
          sleep 8
          curl -f http://localhost:8000/health
          docker stop secflow_ci
